<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Webcam Selfie View</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .start-panel {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        background: #111827;
      }

      .start-panel[hidden] {
        display: none;
      }

      .start-panel p {
        max-width: 28rem;
        margin: 0;
        color: #d1d5db;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.4rem;
        background: #4f46e5;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #6366f1;
      }

      button:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }

      #message {
        min-height: 1.5em;
      }

      .camera-source {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="camera-view" role="img" aria-label="Mirrored live webcam view"></canvas>
    <video class="camera-source" id="camera-source" autoplay muted playsinline></video>
    <main class="start-panel" id="start-panel">
      <button id="start-camera" type="button">Start camera</button>
      <p id="message" role="status" aria-live="polite">Your live selfie view will appear here.</p>
    </main>

    <script>
      const CIG_LENGTH_FACTOR = 1.6;
      const CIG_ANGLE_DEG = 0;
      const CIG_TILT_DEG = 65;
      const MOUTH_OPEN_THRESHOLD = 0.28;
      const NEAR_MOUTH_FACTOR = 0.3;
      const SMOKE_MAX = 600;
      const SMOKE_RATE = 6;
      const SMOKE_GROWTH = 0.9;
      const SMOKE_RISE = 9;
      const EMBER_WISP_INTERVAL = 0.1;
      let currentCigLengthFactor = CIG_LENGTH_FACTOR;
      let currentCigAngleDeg = CIG_ANGLE_DEG;
      let currentCigTiltDeg = CIG_TILT_DEG;

      const canvas = document.querySelector("#camera-view");
      const context = canvas.getContext("2d");
      const smokeSprite = document.createElement("canvas");
      smokeSprite.width = 64;
      smokeSprite.height = 64;
      const smokeSpriteContext = smokeSprite.getContext("2d");
      const smokeGradient = smokeSpriteContext.createRadialGradient(32, 32, 0, 32, 32, 32);
      smokeGradient.addColorStop(0, "rgba(255, 255, 255, 0.9)");
      smokeGradient.addColorStop(0.35, "rgba(255, 255, 255, 0.4)");
      smokeGradient.addColorStop(1, "rgba(255, 255, 255, 0)");
      smokeSpriteContext.fillStyle = smokeGradient;
      smokeSpriteContext.fillRect(0, 0, 64, 64);
      const smokeParticles = [];
      let smokeSpawnAccumulator = 0;
      let emberWispAccumulator = 0;
      const video = document.querySelector("#camera-source");
      const panel = document.querySelector("#start-panel");
      const startButton = document.querySelector("#start-camera");
      const message = document.querySelector("#message");
      let handTracker;
      let faceTracker;
      let hands = [];
      let mouth = null;
      let isTracking = false;
      let lastProcessedVideoTime = -1;
      let inhale = 0;
      let lastInhaleUpdateTime = null;
      let inhaleStatus = "";
      let lastSmokeUpdateTime = null;
      let debugEnabled = false;

      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * pixelRatio);
        canvas.height = Math.round(window.innerHeight * pixelRatio);
      }

      function mapVideoPointToCanvas(point, width, scale, sourceX, sourceY) {
        return {
          x: width - (point.x * video.videoWidth - sourceX) * scale,
          y: (point.y * video.videoHeight - sourceY) * scale
        };
      }

      function getCigaretteGeometry(hand, width, sourceX, sourceY, scale) {
        const { x, y, angle, handSize } = hand.cigarette;
        const anchor = mapVideoPointToCanvas(
          { x, y },
          width,
          scale,
          sourceX,
          sourceY
        );
        const projectedFullLength =
          Math.max(
            handSize * scale * 0.25,
            (handSize * currentCigLengthFactor - hand.cigarette.burnedLength) * scale
          ) *
          Math.cos((currentCigTiltDeg * Math.PI) / 180);

        return {
          anchor,
          emberEnd: {
            x: anchor.x + Math.cos(hand.cigarette.angle) * projectedFullLength * 0.6,
            y: anchor.y + Math.sin(hand.cigarette.angle) * projectedFullLength * 0.6
          },
          filterEnd: {
            x: anchor.x - Math.cos(angle) * projectedFullLength * 0.4,
            y: anchor.y - Math.sin(angle) * projectedFullLength * 0.4
          }
        };
      }

      function drawCigarette(hand, width, height, sourceX, sourceY, scale, pixelRatio) {
        const { x, y, angle, handSize } = hand.cigarette;
        const pinchX = width - (x * video.videoWidth - sourceX) * scale;
        const pinchY = (y * video.videoHeight - sourceY) * scale;
        const tiltRadians = (currentCigTiltDeg * Math.PI) / 180;
        const fullLength = Math.max(
          handSize * scale * 0.25,
          (handSize * currentCigLengthFactor - hand.cigarette.burnedLength) * scale
        );
        const projectedFullLength = fullLength * Math.cos(tiltRadians);
        const visibleLength = projectedFullLength * 0.6;
        const perspective = Math.sin(tiltRadians);
        const thickness = Math.max(9 * pixelRatio, fullLength * 0.09);
        const bodyHalfWidth = thickness / 2;
        const emberRadius = thickness * 0.9 * (1 + 0.5 * perspective);
        const emberRadiusAlongAxis = emberRadius * perspective;
        const emberX = visibleLength;
        const flicker = 0.88 + (Math.sin(performance.now() / 85) + 1) * 0.08;
        const glowScale = 1 + inhale * 0.6;

        context.save();
        context.translate(pinchX, pinchY);
        context.rotate(angle);

        const bodyGradient = context.createLinearGradient(
          0,
          -bodyHalfWidth,
          0,
          bodyHalfWidth
        );
        bodyGradient.addColorStop(0, "#77736e");
        bodyGradient.addColorStop(0.2, "#f4f1e8");
        bodyGradient.addColorStop(0.5, "#ffffff");
        bodyGradient.addColorStop(0.8, "#f4f1e8");
        bodyGradient.addColorStop(1, "#77736e");
        context.fillStyle = bodyGradient;
        context.beginPath();
        context.moveTo(0, -bodyHalfWidth * 0.8);
        context.lineTo(emberX, -emberRadius);
        context.lineTo(emberX, emberRadius);
        context.lineTo(0, bodyHalfWidth * 0.8);
        context.closePath();
        context.fill();

        context.save();
        context.translate(emberX, 0);
        context.scale(Math.max(0.12, emberRadiusAlongAxis), emberRadius);

        const glow = context.createRadialGradient(0, 0, 0.1, 0, 0, 3 * glowScale);
        glow.addColorStop(
          0,
          `rgba(255, ${Math.round(92 + inhale * 145)}, ${Math.round(20 + inhale * 210)}, ${0.48 * flicker})`
        );
        glow.addColorStop(0.55, `rgba(255, ${Math.round(48 + inhale * 120)}, 8, ${0.24 * flicker})`);
        glow.addColorStop(1, "rgba(255, 30, 0, 0)");
        context.fillStyle = glow;
        context.beginPath();
        context.arc(0, 0, 3 * glowScale, 0, Math.PI * 2);
        context.fill();

        const emberRing = context.createRadialGradient(0, 0, 0.54, 0, 0, 1);
        emberRing.addColorStop(0, `rgb(255, ${Math.round(50 + inhale * 205)}, ${Math.round(18 + inhale * 222)})`);
        emberRing.addColorStop(0.72, `rgb(255, ${Math.round(74 + inhale * 150)}, ${Math.round(18 + inhale * 140)})`);
        emberRing.addColorStop(1, `rgb(255, ${Math.round(189 + inhale * 66)}, ${Math.round(69 + inhale * 160)})`);
        context.fillStyle = emberRing;
        context.beginPath();
        context.ellipse(0, 0, 1, 1, 0, 0, Math.PI * 2);
        context.fill();

        context.fillStyle = "#77736e";
        context.beginPath();
        const ashPoints = [
          [0.56, -0.08],
          [0.64, -0.45],
          [0.18, -0.64],
          [-0.25, -0.52],
          [-0.61, -0.31],
          [-0.67, 0.08],
          [-0.43, 0.49],
          [-0.05, 0.58],
          [0.38, 0.42],
          [0.63, 0.2]
        ];
        ashPoints.forEach(([pointX, pointY], index) => {
          const ashX = pointX;
          const ashY = pointY;
          if (index === 0) context.moveTo(ashX, ashY);
          else context.lineTo(ashX, ashY);
        });
        context.closePath();
        context.fill();

        context.fillStyle = `rgba(255, 104, 26, ${0.78 * flicker})`;
        context.beginPath();
        context.arc(0.48, -0.08, 0.12, 0, Math.PI * 2);
        context.arc(-0.42, 0.24, 0.1, 0, Math.PI * 2);
        context.fill();
        context.restore();
        context.restore();
      }

      function updateAndDrawSmoke(deltaSeconds, isBlowing, mouthPoint, faceWidth) {
        if (isBlowing && mouthPoint && faceWidth > 0) {
          const particlesPerSecond = (2 + SMOKE_RATE * inhale) * 30;
          smokeSpawnAccumulator += particlesPerSecond * deltaSeconds;
          const spawnCount = Math.floor(smokeSpawnAccumulator);
          smokeSpawnAccumulator -= spawnCount;

          for (let index = 0; index < spawnCount; index += 1) {
            if (smokeParticles.length >= SMOKE_MAX) smokeParticles.shift();

            const spread = (Math.random() - 0.5) * (Math.PI / 3);
            const direction = Math.PI / 2 + spread;
            const speed = (35 + inhale * 90) * (0.8 + Math.random() * 0.4);
            smokeParticles.push({
              x: mouthPoint.x + (Math.random() - 0.5) * faceWidth * 0.06,
              y: mouthPoint.y + faceWidth * 0.025,
              vx: Math.cos(direction) * speed,
              vy: Math.sin(direction) * speed,
              radius: faceWidth * 0.06 * (0.8 + Math.random() * 0.4),
              life: 1,
              maxAlpha: 0.45,
              driftPhase: Math.random() * Math.PI * 2,
              age: 0,
              lifetime: 2.5 + Math.random() * 1.5,
              previousDrift: 0
            });
          }
        } else {
          smokeSpawnAccumulator = 0;
        }

        const damping = Math.pow(0.985, deltaSeconds * 60);
        for (let index = smokeParticles.length - 1; index >= 0; index -= 1) {
          const particle = smokeParticles[index];
          particle.age += deltaSeconds;
          particle.life = Math.max(0, 1 - particle.age / particle.lifetime);
          if (particle.life <= 0) {
            smokeParticles.splice(index, 1);
            continue;
          }

          particle.vx *= damping;
          particle.vy *= damping;
          if (particle.age > 0.15) particle.vy -= SMOKE_RISE * deltaSeconds;
          const drift = Math.sin(particle.age * 2.4 + particle.driftPhase) * 10;
          particle.x += particle.vx * deltaSeconds + (drift - particle.previousDrift);
          particle.y += particle.vy * deltaSeconds;
          particle.previousDrift = drift;
          particle.radius *= 1 + SMOKE_GROWTH * deltaSeconds;

          context.save();
          context.globalAlpha = particle.maxAlpha * particle.life;
          context.drawImage(
            smokeSprite,
            particle.x - particle.radius,
            particle.y - particle.radius,
            particle.radius * 2,
            particle.radius * 2
          );
          context.restore();
        }
      }

      function emitEmberWisps(deltaSeconds, pinchingHands, width, sourceX, sourceY, scale) {
        if (pinchingHands.length === 0) {
          emberWispAccumulator = 0;
          return;
        }

        emberWispAccumulator += deltaSeconds;
        while (emberWispAccumulator + 1e-9 >= EMBER_WISP_INTERVAL) {
          emberWispAccumulator = Math.max(
            0,
            emberWispAccumulator - EMBER_WISP_INTERVAL
          );
          for (const hand of pinchingHands) {
            const { emberEnd } = getCigaretteGeometry(hand, width, sourceX, sourceY, scale);
            if (smokeParticles.length >= SMOKE_MAX) smokeParticles.shift();

            smokeParticles.push({
              x: emberEnd.x,
              y: emberEnd.y,
              vx: Math.cos(hand.cigarette.angle) * 7 + (Math.random() - 0.5) * 4,
              vy: Math.sin(hand.cigarette.angle) * 7 - 9 + (Math.random() - 0.5) * 3,
              radius: Math.max(2, (hand.cigarette.handSize * scale) * 0.012),
              life: 1,
              maxAlpha: 0.12,
              driftPhase: Math.random() * Math.PI * 2,
              age: 0,
              lifetime: 1.8 + Math.random() * 0.6,
              previousDrift: 0
            });
          }
        }
      }

      function renderFrame() {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          const width = canvas.width;
          const height = canvas.height;
          const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
          const sourceWidth = width / scale;
          const sourceHeight = height / scale;
          const sourceX = (video.videoWidth - sourceWidth) / 2;
          const sourceY = (video.videoHeight - sourceHeight) / 2;
          const now = performance.now();
          const deltaSeconds = lastInhaleUpdateTime === null
            ? 0
            : Math.min((now - lastInhaleUpdateTime) / 1000, 0.1);
          lastInhaleUpdateTime = now;
          const smokeDeltaSeconds = lastSmokeUpdateTime === null
            ? 0
            : Math.min((now - lastSmokeUpdateTime) / 1000, 0.1);
          lastSmokeUpdateTime = now;
          let cigaretteAtMouth = false;
          let chargingInhale = false;
          let mouthPoint = null;

          if (mouth) {
            mouthPoint = mapVideoPointToCanvas(
              mouth.center,
              width,
              scale,
              sourceX,
              sourceY
            );
            for (const hand of hands) {
              if (!hand.isPinching) continue;

              const { filterEnd } = getCigaretteGeometry(
                hand,
                width,
                sourceX,
                sourceY,
                scale
              );
              const distanceToMouth = Math.hypot(
                filterEnd.x - mouthPoint.x,
                filterEnd.y - mouthPoint.y
              );
              const nearDistance = mouth.faceWidth * scale * NEAR_MOUTH_FACTOR;
              if (distanceToMouth <= nearDistance) {
                cigaretteAtMouth = true;
                if (!mouth.isOpen) {
                  chargingInhale = true;
                  hand.cigarette.burnedLength +=
                    hand.cigarette.handSize * 0.012 * deltaSeconds;
                }
              }
            }
          }

          if (chargingInhale) {
            inhale = Math.min(1, inhale + 0.5 * deltaSeconds);
          } else if (mouth?.isOpen && inhale > 0) {
            inhale = Math.max(0, inhale - 0.45 * deltaSeconds);
          } else if (!cigaretteAtMouth) {
            inhale = Math.max(0, inhale - 0.3 * deltaSeconds);
          }

          const isBlowing = Boolean(mouth?.isOpen && inhale > 0.05);
          const pinchingHands = hands.filter((hand) => hand.isPinching);
          if (pinchingHands.length > 0 && inhale > 0.3) {
            inhaleStatus = "Now blow it out!";
          } else if (chargingInhale) {
            inhaleStatus = "Inhaling...";
          } else if (pinchingHands.length > 0 && !cigaretteAtMouth) {
            inhaleStatus = "Bring it to your mouth";
          } else if (pinchingHands.length === 0) {
            inhaleStatus = "Pinch your fingers";
          } else {
            inhaleStatus = "";
          }

          context.save();
          context.setTransform(-1, 0, 0, 1, width, 0);
          context.drawImage(
            video,
            sourceX,
            sourceY,
            sourceWidth,
            sourceHeight,
            0,
            0,
            width,
            height
          );
          context.restore();

          const pixelRatio = window.devicePixelRatio || 1;
          for (const hand of hands) {
            if (hand.isPinching) {
              drawCigarette(hand, width, height, sourceX, sourceY, scale, pixelRatio);
              continue;
            }

            for (const landmarkIndex of [4, 8]) {
              const landmark = hand.landmarks[landmarkIndex];
              const { x, y } = mapVideoPointToCanvas(
                landmark,
                width,
                scale,
                sourceX,
                sourceY
              );
              const radius = 12 * pixelRatio;

              context.save();
              context.shadowColor = "#a78bfa";
              context.shadowBlur = 22 * pixelRatio;
              context.fillStyle = "#c4b5fd";
              context.beginPath();
              context.arc(x, y, radius, 0, Math.PI * 2);
              context.fill();
              context.restore();
            }
          }

          emitEmberWisps(
            smokeDeltaSeconds,
            pinchingHands,
            width,
            sourceX,
            sourceY,
            scale
          );
          updateAndDrawSmoke(
            smokeDeltaSeconds,
            isBlowing,
            mouthPoint,
            mouth ? mouth.faceWidth * scale : 0
          );

          if (debugEnabled && mouth) {
            const { x, y } = mapVideoPointToCanvas(
              mouth.center,
              width,
              scale,
              sourceX,
              sourceY
            );
            context.save();
            context.fillStyle = "#22c55e";
            context.beginPath();
            context.arc(x, y, 5 * pixelRatio, 0, Math.PI * 2);
            context.fill();
            context.restore();
          }

          if (debugEnabled) {
            context.save();
            context.font = `600 ${14 * pixelRatio}px system-ui, sans-serif`;
            context.textAlign = "right";
            context.textBaseline = "top";
            context.fillStyle = "rgba(255, 255, 255, 0.82)";
            context.shadowColor = "#000000";
            context.shadowBlur = 5 * pixelRatio;
            context.fillText(
              `LEN ${currentCigLengthFactor.toFixed(1)}×  ANG ${currentCigAngleDeg}°  TILT ${currentCigTiltDeg}°`,
              width - 18 * pixelRatio,
              18 * pixelRatio
            );
            context.fillText(
              `MOUTH ${mouth ? mouth.open.toFixed(2) : "--"}  ${mouth?.isOpen ? "OPEN" : "CLOSED"}  SMOKE ${smokeParticles.length}`,
              width - 18 * pixelRatio,
              40 * pixelRatio
            );
            context.fillText(
              `INHALE ${Math.round(inhale * 100)}%`,
              width - 18 * pixelRatio,
              62 * pixelRatio
            );
            const barWidth = 140 * pixelRatio;
            const barHeight = 8 * pixelRatio;
            const barX = width - 18 * pixelRatio - barWidth;
            const barY = 84 * pixelRatio;
            context.fillStyle = "rgba(255, 255, 255, 0.3)";
            context.fillRect(barX, barY, barWidth, barHeight);
            context.fillStyle = "#fb923c";
            context.fillRect(barX, barY, barWidth * inhale, barHeight);
            context.restore();
          }

          if (inhaleStatus) {
            context.save();
            context.font = `600 ${18 * pixelRatio}px system-ui, sans-serif`;
            context.textAlign = "center";
            context.textBaseline = "bottom";
            context.fillStyle = "rgba(255, 255, 255, 0.95)";
            context.shadowColor = "#000000";
            context.shadowBlur = 8 * pixelRatio;
            context.fillText(inhaleStatus, width / 2, height - 28 * pixelRatio);
            context.restore();
          }
        }

        window.requestAnimationFrame(renderFrame);
      }

      function updateHands(results) {
        const detectedHands = results.multiHandLandmarks || [];
        const previousHands = hands;

        hands = detectedHands.map((landmarks, handIndex) => {
          const previous = previousHands[handIndex];
          const smoothedLandmarks = landmarks.map((landmark, landmarkIndex) => {
            const priorLandmark = previous?.landmarks[landmarkIndex];
            if (!priorLandmark) return { x: landmark.x, y: landmark.y };

            return {
              x: priorLandmark.x * 0.35 + landmark.x * 0.65,
              y: priorLandmark.y * 0.35 + landmark.y * 0.65
            };
          });
          const thumb = smoothedLandmarks[4];
          const index = smoothedLandmarks[8];
          const wrist = smoothedLandmarks[0];
          const middleKnuckle = smoothedLandmarks[9];
          const pixelDistance = (first, second) =>
            Math.hypot(
              (first.x - second.x) * video.videoWidth,
              (first.y - second.y) * video.videoHeight
            );
          const referenceDistance = pixelDistance(wrist, middleKnuckle);
          const pinchDistance = pixelDistance(thumb, index);
          const pinchPoint = {
            x: (thumb.x + index.x) / 2,
            y: (thumb.y + index.y) / 2
          };
          const indexBase = smoothedLandmarks[6];
          const indexTip = smoothedLandmarks[8];
          const targetAngle = Math.atan2(
            (indexTip.y - indexBase.y) * video.videoHeight,
            -(indexTip.x - indexBase.x) * video.videoWidth
          ) + (currentCigAngleDeg * Math.PI) / 180;
          const pinchDetected =
            referenceDistance > 0 &&
            pinchDistance / referenceDistance < 0.38;
          const pinchFramesRemaining = pinchDetected
            ? 4
            : Math.max(0, (previous?.pinchFramesRemaining || 0) - 1);
          const priorCigarette = previous?.cigarette;
          const angleDifference = priorCigarette
            ? Math.atan2(
                Math.sin(targetAngle - priorCigarette.angle),
                Math.cos(targetAngle - priorCigarette.angle)
              )
            : 0;
          const cigarette = priorCigarette
            ? {
                x: priorCigarette.x * 0.7 + pinchPoint.x * 0.3,
                y: priorCigarette.y * 0.7 + pinchPoint.y * 0.3,
                angle: priorCigarette.angle + angleDifference * 0.25,
                handSize: priorCigarette.handSize * 0.7 + referenceDistance * 0.3,
                burnedLength: priorCigarette.burnedLength || 0
              }
            : {
                ...pinchPoint,
                angle: targetAngle,
                handSize: referenceDistance,
                burnedLength: 0
              };

          return {
            landmarks: smoothedLandmarks,
            cigarette,
            pinchFramesRemaining,
            isPinching: pinchFramesRemaining > 0
          };
        });
      }

      function updateMouth(results) {
        const landmarks = results.multiFaceLandmarks?.[0];
        if (!landmarks) {
          mouth = null;
          return;
        }

        const centerA = landmarks[13];
        const centerB = landmarks[14];
        const leftMouth = landmarks[61];
        const rightMouth = landmarks[291];
        const leftFace = landmarks[234];
        const rightFace = landmarks[454];
        const distance = (first, second) =>
          Math.hypot(
            (first.x - second.x) * video.videoWidth,
            (first.y - second.y) * video.videoHeight
          );
        const mouthWidth = distance(leftMouth, rightMouth);
        const faceWidth = distance(leftFace, rightFace);
        const measuredOpen = mouthWidth > 0 ? distance(centerA, centerB) / mouthWidth : 0;
        const previous = mouth;
        const center = {
          x: (centerA.x + centerB.x) / 2,
          y: (centerA.y + centerB.y) / 2
        };
        const open = measuredOpen;

        mouth = {
          center: previous
            ? {
                x: previous.center.x * 0.65 + center.x * 0.35,
                y: previous.center.y * 0.65 + center.y * 0.35
              }
            : center,
          open: previous ? previous.open * 0.65 + open * 0.35 : open,
          faceWidth,
          isOpen: (previous ? previous.open * 0.65 + open * 0.35 : open) >=
            MOUTH_OPEN_THRESHOLD
        };
      }

      function handleTrackingError(error) {
        if (!isTracking) return;

        isTracking = false;
        video.srcObject?.getTracks().forEach((track) => track.stop());
        video.srcObject = null;
        hands = [];
        mouth = null;
        handTracker?.close();
        handTracker = null;
        faceTracker?.close();
        faceTracker = null;
        panel.hidden = false;
        startButton.disabled = false;
        message.textContent =
          "We couldn’t start hand tracking. Check your camera permission and internet connection, then try again.";
        console.error("Unable to track hands:", error);
      }

      function scheduleHandFrame() {
        if (!isTracking) return;

        if ("requestVideoFrameCallback" in video) {
          video.requestVideoFrameCallback(processHandFrame);
        } else {
          window.requestAnimationFrame(processHandFrame);
        }
      }

      async function processHandFrame() {
        if (!isTracking) return;

        if (!("requestVideoFrameCallback" in video)) {
          if (video.currentTime === lastProcessedVideoTime) {
            window.requestAnimationFrame(processHandFrame);
            return;
          }
          lastProcessedVideoTime = video.currentTime;
        }

        try {
          await handTracker.send({ image: video });
          await faceTracker.send({ image: video });
          scheduleHandFrame();
        } catch (error) {
          handleTrackingError(error);
        }
      }

      async function startCamera() {
        startButton.disabled = true;
        message.textContent = "Starting your camera and hand tracking…";
        let stream;

        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Camera access is unavailable in this browser or page context.");
          }
          if (typeof Hands === "undefined") {
            throw new Error("MediaPipe Hands could not be loaded.");
          }
          if (typeof FaceMesh === "undefined") {
            throw new Error("MediaPipe Face Mesh could not be loaded.");
          }

          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: "user" }
          });
          video.srcObject = stream;
          await video.play();

          handTracker = new Hands({
            locateFile: (file) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
          });
          handTracker.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          handTracker.onResults((results) => {
            updateHands(results);
          });
          faceTracker = new FaceMesh({
            locateFile: (file) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${file}`
          });
          faceTracker.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          faceTracker.onResults(updateMouth);
          await handTracker.send({ image: video });
          await faceTracker.send({ image: video });

          resizeCanvas();
          isTracking = true;
          lastProcessedVideoTime = video.currentTime;
          panel.hidden = true;
          window.requestAnimationFrame(renderFrame);
          scheduleHandFrame();
        } catch (error) {
          stream?.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
          handTracker?.close();
          handTracker = null;
          faceTracker?.close();
          faceTracker = null;
          mouth = null;
          startButton.disabled = false;
          message.textContent =
            "We couldn’t start your camera or hand tracking. Check your camera permission and internet connection, then try again.";
          console.error("Unable to start the webcam and hand tracking:", error);
        }
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("keydown", (event) => {
        if (event.key.toLowerCase() === "d") {
          debugEnabled = !debugEnabled;
          event.preventDefault();
          return;
        }

        switch (event.key) {
          case "[":
            currentCigAngleDeg -= 5;
            break;
          case "]":
            currentCigAngleDeg += 5;
            break;
          case "-":
            currentCigLengthFactor = Math.max(0.3, currentCigLengthFactor - 0.1);
            break;
          case "=":
            currentCigLengthFactor = Math.min(3, currentCigLengthFactor + 0.1);
            break;
          case ";":
            currentCigTiltDeg = Math.max(0, currentCigTiltDeg - 5);
            break;
          case "'":
            currentCigTiltDeg = Math.min(90, currentCigTiltDeg + 5);
            break;
          default:
            return;
        }

        event.preventDefault();
      });
      resizeCanvas();
      startButton.addEventListener("click", startCamera);
    </script>
  </body>
</html>
