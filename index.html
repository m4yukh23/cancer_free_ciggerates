<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Webcam Selfie View</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      .start-panel {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 1rem;
        padding: 1.5rem;
        text-align: center;
        background: #111827;
      }

      .start-panel[hidden] {
        display: none;
      }

      .start-panel p {
        max-width: 28rem;
        margin: 0;
        color: #d1d5db;
        line-height: 1.5;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 0.85rem 1.4rem;
        background: #4f46e5;
        color: white;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button:hover {
        background: #6366f1;
      }

      button:focus-visible {
        outline: 3px solid #c4b5fd;
        outline-offset: 3px;
      }

      #message {
        min-height: 1.5em;
      }

      .camera-source {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <canvas id="camera-view" role="img" aria-label="Mirrored live webcam view"></canvas>
    <video class="camera-source" id="camera-source" autoplay muted playsinline></video>
    <main class="start-panel" id="start-panel">
      <button id="start-camera" type="button">Start camera</button>
      <p id="message" role="status" aria-live="polite">Your live selfie view will appear here.</p>
    </main>

    <script>
      const canvas = document.querySelector("#camera-view");
      const context = canvas.getContext("2d");
      const video = document.querySelector("#camera-source");
      const panel = document.querySelector("#start-panel");
      const startButton = document.querySelector("#start-camera");
      const message = document.querySelector("#message");
      let handTracker;
      let handLandmarks = [];
      let isTracking = false;
      let lastProcessedVideoTime = -1;

      function resizeCanvas() {
        const pixelRatio = window.devicePixelRatio || 1;
        canvas.width = Math.round(window.innerWidth * pixelRatio);
        canvas.height = Math.round(window.innerHeight * pixelRatio);
      }

      function renderFrame() {
        if (video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
          const width = canvas.width;
          const height = canvas.height;
          const scale = Math.max(width / video.videoWidth, height / video.videoHeight);
          const sourceWidth = width / scale;
          const sourceHeight = height / scale;
          const sourceX = (video.videoWidth - sourceWidth) / 2;
          const sourceY = (video.videoHeight - sourceHeight) / 2;

          context.save();
          context.setTransform(-1, 0, 0, 1, width, 0);
          context.drawImage(
            video,
            sourceX,
            sourceY,
            sourceWidth,
            sourceHeight,
            0,
            0,
            width,
            height
          );
          context.restore();

          const pixelRatio = window.devicePixelRatio || 1;
          for (const landmarks of handLandmarks) {
            for (const landmarkIndex of [4, 8]) {
              const landmark = landmarks[landmarkIndex];
              const x = width - (landmark.x * video.videoWidth - sourceX) * scale;
              const y = (landmark.y * video.videoHeight - sourceY) * scale;
              const radius = 12 * pixelRatio;

              context.save();
              context.shadowColor = "#a78bfa";
              context.shadowBlur = 22 * pixelRatio;
              context.fillStyle = "#c4b5fd";
              context.beginPath();
              context.arc(x, y, radius, 0, Math.PI * 2);
              context.fill();
              context.restore();
            }
          }
        }

        window.requestAnimationFrame(renderFrame);
      }

      function handleTrackingError(error) {
        if (!isTracking) return;

        isTracking = false;
        video.srcObject?.getTracks().forEach((track) => track.stop());
        video.srcObject = null;
        handLandmarks = [];
        handTracker?.close();
        handTracker = null;
        panel.hidden = false;
        startButton.disabled = false;
        message.textContent =
          "We couldn’t start hand tracking. Check your camera permission and internet connection, then try again.";
        console.error("Unable to track hands:", error);
      }

      function scheduleHandFrame() {
        if (!isTracking) return;

        if ("requestVideoFrameCallback" in video) {
          video.requestVideoFrameCallback(processHandFrame);
        } else {
          window.requestAnimationFrame(processHandFrame);
        }
      }

      async function processHandFrame() {
        if (!isTracking) return;

        if (!("requestVideoFrameCallback" in video)) {
          if (video.currentTime === lastProcessedVideoTime) {
            window.requestAnimationFrame(processHandFrame);
            return;
          }
          lastProcessedVideoTime = video.currentTime;
        }

        try {
          await handTracker.send({ image: video });
          scheduleHandFrame();
        } catch (error) {
          handleTrackingError(error);
        }
      }

      async function startCamera() {
        startButton.disabled = true;
        message.textContent = "Starting your camera and hand tracking…";
        let stream;

        try {
          if (!navigator.mediaDevices?.getUserMedia) {
            throw new Error("Camera access is unavailable in this browser or page context.");
          }
          if (typeof Hands === "undefined") {
            throw new Error("MediaPipe Hands could not be loaded.");
          }

          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: { facingMode: "user" }
          });
          video.srcObject = stream;
          await video.play();

          handTracker = new Hands({
            locateFile: (file) =>
              `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${file}`
          });
          handTracker.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
          });
          handTracker.onResults((results) => {
            handLandmarks = results.multiHandLandmarks || [];
          });
          await handTracker.send({ image: video });

          resizeCanvas();
          isTracking = true;
          lastProcessedVideoTime = video.currentTime;
          panel.hidden = true;
          window.requestAnimationFrame(renderFrame);
          scheduleHandFrame();
        } catch (error) {
          stream?.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
          handTracker?.close();
          handTracker = null;
          startButton.disabled = false;
          message.textContent =
            "We couldn’t start your camera or hand tracking. Check your camera permission and internet connection, then try again.";
          console.error("Unable to start the webcam and hand tracking:", error);
        }
      }

      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      startButton.addEventListener("click", startCamera);
    </script>
  </body>
</html>
